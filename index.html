  <link rel="dns-prefetch" href="https://images.unsplash.com" />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <!-- Preconnect for external domains (feeds faster TLS/DNS) -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <!-- Google Fonts: Inter - non-blocking with display=swap -->

    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  </noscript>

  <!-- LCP Optimization: Skeleton background colors for faster perceived load -->
  <style>
    :root {
      --primary: #059669;
      --bg: #f8fafc;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    #root {
      min-height: 100vh;
    }

    /* Critical Hero styles to prevent layout shift */
    .hero-placeholder {
      height: 100vh;
      min-height: 600px;
      background: linear-gradient(to right, #0f172a, #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .skeleton-box {
      background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: 12px;
    }

    @keyframes skeleton-loading {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }
  </style>
