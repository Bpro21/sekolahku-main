  <!-- Preconnect for external domains (speeds up DNS + TLS) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://i.pravatar.cc" crossorigin />

  <!-- Google Fonts: Inter - non-blocking with display=swap -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  </noscript>

  <!-- LCP Optimization: Hero background image is dynamic, preloading handled via component logic or removed to avoid unused warnings -->

  <!-- Google Verification -->
  <meta name="google-site-verification" content="Xu_8YmsaeH0-fmq4MZ5lfLItLeOYXCSbTEC6HXMCS5E" />

  <!-- Critical inline styles to prevent layout shift before CSS loads -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #f8fafc;
    }

    #root {
      min-height: 100vh;
    }

    .app-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
  </style>

  <!-- Midtrans Snap: loaded ONLY when needed via dynamic import in PaymentHistory component -->
  <!-- Removed from global HTML to avoid blocking public page loads -->
</head>
