<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- DNS Prefetch (speeds up initial discovery of external assets) -->
  <link rel="dns-prefetch" href="https://uxqpcizthigbddcbjndi.supabase.co" />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <!-- Preconnect for external domains (feeds faster TLS/DNS) -->
  <link rel="preconnect" href="https://uxqpcizthigbddcbjndi.supabase.co" />
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Google Fonts: Inter - non-blocking with display=swap -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  </noscript>

  <!-- LCP Optimization: Preload LOCAL Hero Image with High Priority -->
  <link rel="preload" as="image" href="/hero.jpg" fetchpriority="high" />

  <!-- Critical Path CSS -->
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --bg: #f8fafc;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
    }

    /* Critical Hero Shell - renders before JS loads */
    .hero-shell {
      position: relative;
      height: 100vh;
      min-height: 600px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: #0f172a;
    }

    .hero-shell img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-shell .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(6, 78, 59, 0.92), rgba(6, 78, 59, 0.75), rgba(6, 78, 59, 0.4));
    }

    .hero-shell .content {
      position: relative;
      z-index: 10;
      color: white;
      max-width: 48rem;
      padding: 5rem 1rem 0;
      margin: 0 auto;
    }

    .hero-shell h1 {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin: 0 0 1rem;
    }

    .hero-shell p {
      font-size: 1rem;
      opacity: 0.85;
      line-height: 1.6;
      margin: 0;
    }

    @media (min-width: 768px) {
      .hero-shell h1 {
        font-size: 4rem;
      }

      .hero-shell .content {
        padding: 5rem 2rem 0;
      }
    }
  </style>

  <!-- Primary Meta Tags -->
  <title>Sistem Informasi PSMB 2026 - Pendaftaran Sekolah Digital Modern</title>
  <meta name="title" content="Sistem Informasi PSMB 2026 - Pendaftaran Sekolah Digital Modern" />
  <meta name="description"
    content="Aplikasi PPDB & PSMB Online 2026 Terpadu. Fitur lengkap: formulir kustom, verifikasi berkas, integrasi pembayaran VA/E-Wallet, dan laporan real-time untuk sekolah modern." />

  <!-- Google Verification -->
  <meta name="google-site-verification" content="Xu_8YmsaeH0-fmq4MZ5lfLItLeOYXCSbTEC6HXMCS5E" />

</head>

<body>
  <!-- SSR-like shell: renders IMMEDIATELY before JS loads -->
  <div id="root">
    <div class="hero-shell">
      <img src="/hero.jpg" alt="Gedung Sekolah" width="1280" height="720" fetchpriority="high" decoding="sync" />
      <div class="overlay"></div>
      <div class="content">
        <h1>Siapkan Masa Depan<br />Gemilang Buah Hati</h1>
        <p>Bergabunglah dengan Sekolah Islam Terpadu. Dapatkan fasilitas terbaik dan kurikulum yang memadukan IPTEK
          dengan IMTAQ untuk masa depan putra-putri Anda.</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
